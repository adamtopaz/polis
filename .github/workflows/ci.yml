name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: polis-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/adamtopaz/polis
  PI_IMAGE: ghcr.io/adamtopaz/polis-pi

jobs:
  check-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Check package, tests, and formatting
        run: nix flake check --print-build-logs

      - name: Build container images
        run: |
          nix build .#container --out-link result-controller --print-build-logs
          nix build .#pi-container --out-link result-pi --print-build-logs

      - name: Load container images
        run: |
          docker load --input result-controller
          docker load --input result-pi

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GHCR_TOKEN" | docker login ghcr.io --username "${{ github.actor }}" --password-stdin

      - name: Publish immutable and main tags
        if: github.event_name != 'pull_request'
        run: |
          docker tag polis:dev "$IMAGE:$GITHUB_SHA"
          docker tag polis:dev "$IMAGE:main"
          docker tag polis-pi:dev "$PI_IMAGE:$GITHUB_SHA"
          docker tag polis-pi:dev "$PI_IMAGE:main"
          docker push "$IMAGE:$GITHUB_SHA"
          docker push "$IMAGE:main"
          docker push "$PI_IMAGE:$GITHUB_SHA"
          docker push "$PI_IMAGE:main"
