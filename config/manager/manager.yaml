apiVersion: apps/v1
kind: Deployment
metadata:
  name: polis-controller
  labels:
    app.kubernetes.io/name: polis
    app.kubernetes.io/component: controller
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: polis
      app.kubernetes.io/component: controller
  template:
    metadata:
      annotations:
        kubectl.kubernetes.io/default-container: controller
      labels:
        app.kubernetes.io/name: polis
        app.kubernetes.io/component: controller
    spec:
      serviceAccountName: polis-controller
      terminationGracePeriodSeconds: 30
      securityContext:
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: controller
          image: controller:latest
          imagePullPolicy: Always
          command:
            - /bin/polis-controller
          args:
            - --kubernetes
            - --kubernetes-namespace=$(POD_NAMESPACE)
            - --health-probe-bind-address=:8081
            - --metrics-bind-address=0
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: POLIS_DB_PATH
              value: /data/polis-v1.db
            - name: POLIS_OPERATOR_TOKEN_FILE
              value: /run/secrets/polis/operator-token
            - name: POLIS_WORKER_TOKEN_FILE
              value: /run/secrets/polis-worker/token
          ports:
            - name: http
              containerPort: 8080
            - name: health
              containerPort: 8081
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            initialDelaySeconds: 2
            periodSeconds: 3
          resources:
            requests:
              cpu: 25m
              memory: 48Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 10001
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: data
              mountPath: /data
            - name: operator-token
              mountPath: /run/secrets/polis
              readOnly: true
            - name: worker-token
              mountPath: /run/secrets/polis-worker
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: polis-data
        - name: operator-token
          secret:
            secretName: polis-operator
            defaultMode: 0440
            items:
              - key: token
                path: operator-token
        - name: worker-token
          secret:
            secretName: polis-worker
            defaultMode: 0440
            items:
              - key: token
                path: token
        - name: tmp
          emptyDir: {}
