apiVersion: polis.dev/v1alpha1
kind: Agent
metadata:
  name: sample
spec:
  charter: Pursue useful work and wait for durable mailbox triggers.
  additionalInstructions: |
    Keep operator-facing reports concise and distinguish observations from
    hypotheses.
  runtime:
    image: ghcr.io/adamtopaz/polis-pi:main
    command:
      - /bin/polis-pi-agent
  messaging:
    allowedRecipients:
      - sample
  podTemplate:
    spec:
      volumes:
        - name: workspace
          persistentVolumeClaim:
            claimName: sample-workspace-data
