[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "polis-agent-fleet"
version = "0.1.0"
description = "A small coordination kernel for persistent autonomous agents"
requires-python = ">=3.11"

[project.scripts]
polis = "polis.cli:main"
polis-controller = "polis.controller:main"
polis-runner = "polis.runner:main"
polis-echo-agent = "polis.executors.echo:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
